<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Forest RPG V2 - Modern 2D Pixel-Art RPG built with TypeScript and PixiJS 8" />
    <title>Forest RPG V2</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0b0e14;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, monospace, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }

      #app {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      #game-canvas {
        display: block;
        image-rendering: -moz-crisp-edges;
        image-rendering: -webkit-crisp-edges;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        outline: none;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.85);
      }

      #loading-screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: #0b0e14;
        color: #5ac54f;
        font-family: monospace;
        font-size: 18px;
        letter-spacing: 2px;
        z-index: 9999;
        transition: opacity 0.4s ease-out;
      }

      #loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .spinner {
        width: 32px;
        height: 32px;
        margin-bottom: 16px;
        border: 4px solid #1f2937;
        border-top: 4px solid #5ac54f;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="loading-screen">
        <div class="spinner"></div>
        <span>INITIALIZING FOREST RPG V2...</span>
      </div>
      <canvas id="game-canvas"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
